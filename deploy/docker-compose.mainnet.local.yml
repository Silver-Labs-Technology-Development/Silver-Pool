name: silver-pool-mainnet

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  node:
    build:
      context: ..
      dockerfile: deploy/node/Dockerfile
    image: silver-pool/btcs-node:31.1.3
    restart: unless-stopped
    init: true
    environment:
      BTCS_NETWORK: main
      BTCS_RPC_USER: silver-pool-rpc
      BTCS_RPC_PASSWORD: ${BTCS_RPC_PASSWORD}
      BTCS_RPC_PORT: 10567
      BTCS_P2P_PORT: 10566
      BTCS_RPC_ALLOW_CIDR: 172.16.0.0/12
      BTCS_NODE_MAX_CONNECTIONS: 64
      BTCS_NODE_DBCACHE_MB: 300
    volumes:
      - mainnet-node-data:/data
    ports:
      - "10566:10566"
    healthcheck:
      test: ["CMD", "/usr/local/bin/btcs-node-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  pool:
    build:
      context: ..
      dockerfile: deploy/pool/Dockerfile
    image: silver-pool/pool:0.2.0
    restart: unless-stopped
    init: true
    depends_on:
      node:
        condition: service_healthy
    environment:
      BTCS_NETWORK: main
      BTCS_RPC_URL: http://node:10567
      BTCS_RPC_USER: silver-pool-rpc
      BTCS_RPC_PASSWORD: ${BTCS_RPC_PASSWORD}
      BTCS_RPC_WALLET: pool
      BTCS_RPC_TIMEOUT_SECONDS: 30
      BTCS_NODE_WAIT_SECONDS: 300
      BTCS_POOL_ADDRESS:
      BTCS_POOL_SCRIPT_PUBKEY:
      BTCS_POOL_FEE: 2.0
      BTCS_MIN_PAYOUT: 0.01
      BTCS_PAYOUT_INTERVAL_SECONDS: 300
      BTCS_AUTO_PAYOUTS: "false"
      BTCS_MATURITY_CONFIRMATIONS: 200
      BTCS_STRATUM_PORT: 3334
      BTCS_PUBLIC_STRATUM_HOST:
      BTCS_PUBLIC_STRATUM_PORT: 3333
      BTCS_STRATUM_PASSWORD:
      BTCS_POOL_DIFFICULTY: 1.0
      BTCS_EXTRANONCE2_SIZE: 4
      BTCS_POOL_POLL: 5
      BTCS_MAX_CLIENTS: 500
      BTCS_CLIENT_TIMEOUT_SECONDS: 900
      BTCS_POOL_API_HOST: 0.0.0.0
      BTCS_POOL_API_PORT: 8765
      BTCS_API_CORS_ORIGINS: http://127.0.0.1:8080
      BTCS_TRUSTED_PROXIES: 172.16.0.0/12
      BTCS_POOL_DB: /data/pool.sqlite3
      BTCS_LOG_LEVEL: INFO
    volumes:
      - mainnet-pool-data:/data
    ports:
      - "127.0.0.1:3334:3334"
    expose:
      - "8765"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: silver-pool/web:0.2.0
    restart: unless-stopped
    init: true
    depends_on:
      pool:
        condition: service_started
    environment:
      SILVER_POOL_SITE_ADDRESS:
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
volumes:
  mainnet-node-data:
  mainnet-pool-data:
  caddy-data:
  caddy-config:
