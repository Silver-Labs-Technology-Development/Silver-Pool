name: Build and deploy static Silver Pool website

# This workflow publishes the multi-page frontend to GitHub Pages only.
# The BTCS node, Stratum listener and HTTP API are not hosted on GitHub Pages;
# the deployed site will show honest offline states unless a same-origin API is
# reverse-proxied separately. See deploy/docker-compose.yml for the full stack.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static route and asset tests
        run: npm run test:static
      - name: Browser route, history and error-state tests
        run: npm run test:browser
      - name: Build frontend for the repository subpath
        env:
          SITE_BASE: /Silver-Pool/
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
